[project]
name = "study-mcp"
version = "0.1.0"
description = "MCP server that lets Claude search, quiz and drill you on your own study notes"
readme = "README.md"
authors = [
    { name = "Jal246", email = "181914226+Jal246@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastembed>=0.9.0",
    "mcp[cli]>=2.3.0",
    "numpy>=2.5.4",
    "pypdfium2>=5.14.0",
    "python-pptx>=1.0.2",
]

[project.scripts]
study-mcp = "study_mcp:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
